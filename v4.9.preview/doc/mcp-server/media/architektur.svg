<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#555" stroke-width="1.2"/>
    </marker>
    <marker id="arrow-back" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6" fill="none" stroke="#555" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- Hintergrund, damit die Grafik auch im dunklen Theme lesbar bleibt -->
  <rect x="0" y="0" width="760" height="330" rx="8" fill="#ffffff"/>

  <!-- KI-Client -->
  <rect x="20" y="70" width="170" height="190" rx="10" fill="#e8f0fe" stroke="#4a7cc9" stroke-width="1.5"/>
  <text x="105" y="100" text-anchor="middle" font-weight="bold" font-size="14" fill="#1a3a6b">KI-Client</text>
  <line x1="40" y1="110" x2="170" y2="110" stroke="#4a7cc9" stroke-width="0.8"/>
  <text x="105" y="135" text-anchor="middle" fill="#444">Claude Code</text>
  <text x="105" y="158" text-anchor="middle" fill="#444">VS Code (Copilot)</text>
  <text x="105" y="181" text-anchor="middle" fill="#444">Cursor</text>
  <text x="105" y="204" text-anchor="middle" fill="#444">...</text>

  <!-- Verbindung Client <-> Server -->
  <line x1="190" y1="125" x2="268" y2="125" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow-back)"/>
  <text x="229" y="116" text-anchor="middle" font-size="10" fill="#666">JSON-RPC</text>
  <text x="229" y="141" text-anchor="middle" font-size="10" fill="#666">HTTP /mcp</text>

  <!-- MCP-Server -->
  <rect x="270" y="20" width="210" height="290" rx="10" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="375" y="48" text-anchor="middle" font-weight="bold" font-size="14" fill="#1a5c2b">MCP-Server</text>
  <text x="375" y="66" text-anchor="middle" font-size="11" fill="#444">AddIn in der FrameworkStudio IDE</text>
  <line x1="290" y1="76" x2="460" y2="76" stroke="#34a853" stroke-width="0.8"/>

  <rect x="295" y="90" width="160" height="34" rx="5" fill="#fff" stroke="#34a853" stroke-width="1"/>
  <text x="375" y="112" text-anchor="middle" font-size="12" fill="#333">HTTP-Server localhost:PORT</text>

  <rect x="295" y="140" width="160" height="34" rx="5" fill="#fff" stroke="#34a853" stroke-width="1"/>
  <text x="375" y="162" text-anchor="middle" font-size="12" fill="#333">MCP-Protokoll</text>

  <rect x="295" y="190" width="160" height="34" rx="5" fill="#fff" stroke="#34a853" stroke-width="1"/>
  <text x="375" y="212" text-anchor="middle" font-size="12" fill="#333">Tool-Registry</text>

  <rect x="295" y="250" width="160" height="40" rx="5" fill="#fff" stroke="#34a853" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="375" y="267" text-anchor="middle" font-size="12" fill="#333">Hilfe und API-Referenz</text>
  <text x="375" y="282" text-anchor="middle" font-size="10" fill="#666">passend zur IDE-Version</text>

  <line x1="375" y1="124" x2="375" y2="140" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="375" y1="174" x2="375" y2="190" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="375" y1="224" x2="375" y2="250" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Verbindung Server <-> Repository -->
  <line x1="455" y1="207" x2="528" y2="207" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow-back)"/>
  <text x="503" y="198" text-anchor="middle" font-size="10" fill="#666">FS-API</text>

  <!-- FS-Repository -->
  <rect x="530" y="70" width="210" height="190" rx="10" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="635" y="100" text-anchor="middle" font-weight="bold" font-size="14" fill="#7a5900">FS-Repository</text>
  <line x1="550" y1="110" x2="720" y2="110" stroke="#f9ab00" stroke-width="0.8"/>
  <text x="635" y="135" text-anchor="middle" font-size="12" fill="#444">Components, Forms, Services</text>
  <text x="635" y="158" text-anchor="middle" font-size="12" fill="#444">Code Files, DB-Tabellen</text>
  <text x="635" y="181" text-anchor="middle" font-size="12" fill="#444">Element-Dokumentation</text>
  <text x="635" y="204" text-anchor="middle" font-size="12" fill="#444">Package-Versionen</text>
  <text x="635" y="227" text-anchor="middle" font-size="12" fill="#444">...</text>
  <text x="635" y="248" text-anchor="middle" font-size="10" fill="#666">im Kontext des angemeldeten Benutzers</text>
</svg>
